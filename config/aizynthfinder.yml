# AiZynthFinder Configuration — ChemFlow Intelligence Service
# Phase 1: USPTO pre-trained models (pharma-biased baseline)
# Phase 2: Add specialty chemical fine-tuned models alongside uspto

finder:
  properties:
    # Retrosynthesis tree depth (max reaction steps)
    max_transforms: 6
    # MCTS iterations — trade-off: quality vs. latency
    # 100 = ~30–60s; 200 = ~60–120s on CPU; reduce for dev
    iteration_limit: 100
    # Hard timeout — aligns with our 180s pipeline budget
    time_limit: 120
    # Return as soon as a route is found (false = exhaustive search up to limits)
    return_first: false

# Expansion policy: neural net that proposes retrosynthetic disconnections
# Format: list of [model, templates] per named policy
expansion:
  uspto:
    - /app/data/uspto_model.onnx
    - /app/data/uspto_templates.csv.gz
  # Phase 2: add ringbreaker for ring-forming reactions
  # ringbreaker:
  #   - /app/data/uspto_ringbreaker_model.onnx
  #   - /app/data/uspto_ringbreaker_templates.csv.gz
  # Phase 2: specialty chemical fine-tuned model
  # specialty:
  #   - /app/data/specialty_model.onnx
  #   - /app/data/specialty_templates.csv.gz

# Filter policy: feasibility classifier that prunes low-quality expansions
# Format: plain path string per named filter
filter:
  uspto: /app/data/uspto_filter_model.onnx

# Stock: building blocks considered commercially available (terminates tree search)
stock:
  zinc: /app/data/stocks/zinc_stock.hdf5
  # Phase 2: Customer ERP/inventory (loaded per-tenant at runtime)
  # customer_internal: /app/data/stocks/customer_stock.hdf5
